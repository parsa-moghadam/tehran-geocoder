<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ژئوکدر تهران — آدرس به لوکیشن</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  :root { --bg:#0f1420; --panel:#171e2e; --line:#26304a; --txt:#e8ecf5; --muted:#8b96b0; --acc:#4f8cff; --ok:#2ecc71; --warn:#f1c40f; --bad:#e74c3c; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:Vazirmatn,Tahoma,sans-serif; background:var(--bg); color:var(--txt); height:100vh; display:flex; flex-direction:column; }
  header { padding:12px 18px; background:var(--panel); border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:16px; font-weight:700; white-space:nowrap; }
  header .stats { font-size:11px; color:var(--muted); margin-right:auto; }
  .searchwrap { position:relative; flex:1; min-width:260px; max-width:560px; }
  #q { width:100%; padding:10px 14px; border-radius:10px; border:1px solid var(--line); background:#0d1220; color:var(--txt); font-family:inherit; font-size:14px; outline:none; }
  #q:focus { border-color:var(--acc); }
  #ac { position:absolute; top:105%; right:0; left:0; background:var(--panel); border:1px solid var(--line); border-radius:10px; z-index:30; display:none; max-height:260px; overflow:auto; }
  #ac div { padding:8px 14px; cursor:pointer; font-size:13px; display:flex; justify-content:space-between; gap:8px; }
  #ac div:hover { background:#1f2940; }
  #ac .nb { color:var(--muted); font-size:11px; }
  main { flex:1; display:flex; min-height:0; }
  #results { width:360px; min-width:300px; overflow-y:auto; background:var(--panel); border-left:1px solid var(--line); padding:12px; }
  #results .hint { color:var(--muted); font-size:12px; line-height:1.9; padding:8px; }
  .parsed { font-size:11px; color:var(--muted); padding:4px 8px 10px; line-height:1.8; }
  .card { background:#0d1220; border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:10px; cursor:pointer; transition:border-color .15s; }
  .card:hover, .card.active { border-color:var(--acc); }
  .card .top { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .card .name { font-size:14px; font-weight:600; }
  .card .pct { font-size:13px; font-weight:700; direction:ltr; }
  .card .meta { font-size:11px; color:var(--muted); margin-top:4px; }
  .bar { height:5px; background:#222c44; border-radius:3px; margin-top:8px; overflow:hidden; }
  .bar i { display:block; height:100%; border-radius:3px; }
  #map { flex:1; }
  #info { position:absolute; bottom:14px; right:14px; z-index:20; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px 14px; font-size:12px; display:none; max-width:320px; line-height:2; }
  #info button { margin-top:4px; padding:4px 12px; border:none; border-radius:8px; background:var(--acc); color:#fff; font-family:inherit; font-size:12px; cursor:pointer; }
  .mapwrap { position:relative; flex:1; display:flex; }
  .toast { position:fixed; top:14px; left:50%; transform:translateX(-50%); background:var(--ok); color:#04220f; padding:8px 18px; border-radius:10px; font-size:13px; font-weight:600; z-index:99; display:none; }
  @media (max-width:760px){ main{flex-direction:column;} #results{width:100%; max-height:40vh; border-left:none; border-bottom:1px solid var(--line);} }
</style>
</head>
<body>
<header>
  <h1>📍 ژئوکدر تهران</h1>
  <div class="searchwrap">
    <input id="q" placeholder="آدرس بنویس… مثلاً: تهران خیابان اکبری کوچه لاله پلاک ۱۲" autocomplete="off">
    <div id="ac"></div>
  </div>
  <div class="stats" id="stats"></div>
</header>
<main>
  <div id="results"><div class="hint">
    آدرس رو بنویس و Enter بزن.<br>
    همهٔ خیابان‌های همنام با <b>درصد تطابق</b> نشون داده می‌شن — روی هر کدوم کلیک کنی روی نقشه زوم می‌شه.<br><br>
    پین انتخابی رو می‌تونی <b>drag</b> کنی؛ با دکمهٔ «ثبت اصلاح» سیستم یاد می‌گیره و دفعهٔ بعد دقیق‌تر جواب می‌ده.
  </div></div>
  <div class="mapwrap">
    <div id="map"></div>
    <div id="info"></div>
  </div>
</main>
<div class="toast" id="toast"></div>

<script>
const TEHRAN = [51.389, 35.689];
const map = new maplibregl.Map({
  container: 'map',
  style: {
    version: 8,
    sources: { osm: { type: 'raster', tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'], tileSize: 256, attribution: '© OpenStreetMap contributors' } },
    layers: [{ id: 'osm', type: 'raster', source: 'osm' }]
  },
  center: TEHRAN, zoom: 11
});
map.addControl(new maplibregl.NavigationControl(), 'top-left');

let markers = [], selected = null, lastQuery = '';
const $ = id => document.getElementById(id);

function pctColor(p){ return p >= 85 ? 'var(--ok)' : p >= 60 ? 'var(--warn)' : 'var(--bad)'; }

async function loadStats(){
  try {
    const s = await (await fetch('/api/stats')).json();
    $('stats').textContent = `${s.streets.toLocaleString('fa')} خیابان · ${s.neighborhoods} محله · ${s.districts} منطقه · ${s.learned} آموخته‌شده` + (s.municipality_streets ? ` · ${s.municipality_streets.toLocaleString('fa')} اسم شهرداری` : '') + (s.municipality_addresses ? ` · ${s.municipality_addresses.toLocaleString('fa')} پلاک` : '') + (s.parser_available ? ' · مدل CRF فعال' : ' · مدل هنوز آموزش ندیده');
  } catch(e){}
}
loadStats();

function clearMarkers(){ markers.forEach(m => m.remove()); markers = []; }

function renderResults(data){
  lastQuery = data.query;
  const box = $('results');
  box.innerHTML = '';
  const f = data.parsed || {};
  const bits = Object.entries(f).map(([k,v]) => `${({street:'خیابان',alley:'کوچه',number:'پلاک',unit:'واحد',floor:'طبقه',city:'شهر',neighborhood:'محله',district:'منطقه'})[k]||k}: ${v}`);
  if (bits.length) box.innerHTML = `<div class="parsed">🧠 ${bits.join(' · ')}${data.parser_available ? '' : ' (بدون مدل — جستجوی خام)'}</div>`;
  if (!data.candidates.length){
    box.innerHTML += '<div class="hint">چیزی پیدا نشد. اسم خیابان یا محله رو ساده‌تر بنویس.</div>';
    return;
  }
  clearMarkers();
  data.candidates.forEach((c, i) => {
    const el = document.createElement('div');
    el.className = 'card';
    el.innerHTML = `
      <div class="top"><span class="name">${c.name}</span><span class="pct" style="color:${pctColor(c.match)}">${c.match}٪</span></div>
      <div class="meta">${c.kind}${c.neighborhood ? ' · ' + c.neighborhood : ''}${c.district ? ' · منطقه ' + c.district : ''}${c.source === 'learned' ? ' · 🎓 آموخته‌شده' : ''}${c.source === 'tehran_muni' ? ' · 🏙 شهرداری' : ''}</div>
      <div class="bar"><i style="width:${c.match}%;background:${pctColor(c.match)}"></i></div>`;
    el.onclick = () => select(c, el, i);
    box.appendChild(el);

    const mk = new maplibregl.Marker({ color: i === 0 ? '#4f8cff' : '#8b96b0', draggable: false })
      .setLngLat([c.lng, c.lat]).addTo(map);
    mk.getElement().addEventListener('click', () => select(c, el, i));
    markers.push(mk);
  });
  if (data.candidates.length) select(data.candidates[0], box.querySelector('.card'), 0, true);
}

function select(c, el, i, fitAll){
  document.querySelectorAll('.card').forEach(x => x.classList.remove('active'));
  if (el) el.classList.add('active');
  selected = c;
  markers.forEach((m, j) => {
    m.setDraggable(j === i);
    m.getElement().style.opacity = j === i ? '1' : '0.55';
  });
  if (fitAll && markers.length > 1){
    const b = new maplibregl.LngLatBounds();
    markers.forEach(m => b.extend(m.getLngLat()));
    map.fitBounds(b, { padding: 80, maxZoom: 15 });
  } else {
    map.flyTo({ center: [c.lng, c.lat], zoom: 16 });
  }
  showInfo(c);
}

function showInfo(c){
  const info = $('info');
  info.style.display = 'block';
  info.innerHTML = `
    <b>${c.name}</b><br>
    <span style="direction:ltr;display:inline-block">${c.lat.toFixed(5)}, ${c.lng.toFixed(5)}</span><br>
    ${c.neighborhood ? c.neighborhood + ' · ' : ''}${c.district ? 'منطقه ' + c.district : ''}<br>
    <button id="copy">کپی مختصات</button>
    <button id="learn" style="background:var(--ok)">ثبت اصلاح (یادگیری)</button>`;
  $('copy').onclick = () => {
    navigator.clipboard.writeText(`${c.lat.toFixed(6)}, ${c.lng.toFixed(6)}`);
    toast('مختصات کپی شد');
  };
  $('learn').onclick = async () => {
    const mk = markers.find(m => m.isDraggable());
    const pos = mk ? mk.getLngLat() : { lat: c.lat, lng: c.lng };
    await fetch('/api/feedback', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query: lastQuery, street_id: c.id, lat: pos.lat, lng: pos.lng })
    });
    toast('✅ ثبت شد — سیستم یاد گرفت');
    loadStats();
  };
}

function toast(msg){
  const t = $('toast');
  t.textContent = msg; t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 2200);
}

let timer = null;
$('q').addEventListener('input', e => {
  clearTimeout(timer);
  const v = e.target.value.trim();
  if (v.length < 2){ $('ac').style.display = 'none'; return; }
  timer = setTimeout(async () => {
    const r = await (await fetch('/api/autocomplete?q=' + encodeURIComponent(v))).json();
    const ac = $('ac');
    ac.innerHTML = '';
    if (!r.items.length){ ac.style.display = 'none'; return; }
    r.items.forEach(it => {
      const d = document.createElement('div');
      d.innerHTML = `<span>${it.name}</span><span class="nb">${it.neighborhood || ''}</span>`;
      d.onclick = () => { $('q').value = it.name; ac.style.display = 'none'; search(it.name); };
      ac.appendChild(d);
    });
    ac.style.display = 'block';
  }, 220);
});
$('q').addEventListener('keydown', e => {
  if (e.key === 'Enter'){ $('ac').style.display = 'none'; search(e.target.value.trim()); }
});
document.addEventListener('click', e => { if (!e.target.closest('.searchwrap')) $('ac').style.display = 'none'; });

async function search(q){
  if (!q) return;
  $('results').innerHTML = '<div class="hint">در حال جستجو…</div>';
  try {
    const data = await (await fetch('/api/geocode?q=' + encodeURIComponent(q))).json();
    renderResults(data);
  } catch(err){
    $('results').innerHTML = '<div class="hint">خطا در ارتباط با سرور.</div>';
  }
}
</script>
</body>
</html>
